<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>МетодКнига — Библиотека учебных материалов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   ROOT & RESET
══════════════════════════════════════ */
:root {
  --bg: #06080f;
  --bg2: #0b0e1a;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --border-bright: rgba(255,255,255,0.15);
  --text: #eef0f8;
  --muted: rgba(238,240,248,0.45);
  --muted2: rgba(238,240,248,0.25);

  --gold: #e8c96a;
  --gold2: #f0da8a;
  --blue: #6eaeff;
  --teal: #4ecdc4;
  --pink: #ff9ed2;
  --purple: #b48dff;

  --r: 16px;
  --r-lg: 24px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  /* Плавный скролл на мобилке */
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
}

/* ══════════════════════════════════════
   NOISE TEXTURE
══════════════════════════════════════ */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.6;
}
@media (max-width: 768px) { body::before { display: none; } }

/* ══════════════════════════════════════
   BG ORBS
══════════════════════════════════════ */
.bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.orb {
  position: absolute; border-radius: 50%;
  filter: blur(120px); opacity: 0.08;
  animation: drift 25s ease-in-out infinite alternate;
  will-change: transform;
}
.orb1 { width: 600px; height: 600px; background: var(--gold); top: -200px; left: -150px; animation-delay: 0s; }
.orb2 { width: 500px; height: 500px; background: var(--blue); top: 30%; right: -180px; animation-delay: -10s; }
.orb3 { width: 450px; height: 450px; background: var(--purple); bottom: -100px; left: 30%; animation-delay: -18s; }
@keyframes drift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(30px, -40px) scale(1.05); }
  100% { transform: translate(-20px, 25px) scale(0.97); }
}
/* На мобилке отключаем тяжёлые эффекты */
@media (max-width: 768px) {
  .orb { animation: none !important; filter: blur(80px); opacity: 0.05; }
  .bg-orbs { display: none; }
}

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
header {
  position: sticky; top: 0; z-index: 100;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem;
  background: rgba(6,8,15,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.logo-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--gold), #c8a040);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 900; color: #06080f;
  box-shadow: 0 0 20px rgba(232,201,106,0.3);
}
.logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700;
  color: var(--text); letter-spacing: -0.3px;
}
.logo-text span { color: var(--gold); }

.header-right { display: flex; align-items: center; gap: 10px; }

#loginBtn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 18px; border-radius: 100px;
  background: rgba(232,201,106,0.1);
  border: 1px solid rgba(232,201,106,0.3);
  color: var(--gold); font-family: 'Outfit', sans-serif;
  font-size: .82rem; font-weight: 600; cursor: pointer;
  transition: all .2s; letter-spacing: .3px;
  -webkit-tap-highlight-color: transparent;
}
#loginBtn:hover { background: rgba(232,201,106,0.18); box-shadow: 0 0 20px rgba(232,201,106,0.15); }

#userChip {
  display: none; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--border);
}
.user-av {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #c8a040);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .72rem; color: #06080f;
  flex-shrink: 0;
}
.user-name { font-size: .8rem; font-weight: 500; }
.user-role {
  font-size: .6rem; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; padding: 2px 8px; border-radius: 100px;
}
.user-role.role-user { background: rgba(110,174,255,0.12); color: var(--blue); border: 1px solid rgba(110,174,255,0.2); }
.user-role.role-admin { background: rgba(232,201,106,0.12); color: var(--gold); border: 1px solid rgba(232,201,106,0.25); }

#logoutBtn {
  background: none; border: none; cursor: pointer; color: var(--muted);
  padding: 6px 8px; border-radius: 8px; font-size: .75rem;
  transition: color .2s; display: none; -webkit-tap-highlight-color: transparent;
}
#logoutBtn:hover { color: #ff6b6b; }

/* ══════════════════════════════════════
   HERO
══════════════════════════════════════ */
.hero {
  position: relative; z-index: 2;
  padding: 5rem 2rem 3.5rem;
  text-align: center;
  max-width: 800px; margin: 0 auto;
}

.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .72rem; font-weight: 600; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--gold);
  padding: 6px 16px; border-radius: 100px;
  background: rgba(232,201,106,0.08); border: 1px solid rgba(232,201,106,0.2);
  margin-bottom: 1.5rem;
  animation: fadeUp .5s ease both;
}
.eyebrow-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 8px var(--gold);
  animation: blink 2s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 6vw, 4rem);
  font-weight: 900; line-height: 1.1;
  letter-spacing: -1.5px;
  margin-bottom: 1rem;
  animation: fadeUp .55s ease .08s both;
}
.hero h1 em {
  font-style: italic;
  background: linear-gradient(135deg, var(--gold) 30%, var(--gold2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero p {
  font-size: 1rem; color: var(--muted);
  line-height: 1.7; margin-bottom: 2.5rem;
  animation: fadeUp .6s ease .16s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════
   SEARCH BAR
══════════════════════════════════════ */
.search-wrap {
  position: relative; z-index: 2;
  display: flex; gap: 10px; max-width: 660px; margin: 0 auto;
  animation: fadeUp .65s ease .24s both;
}

.search-input-wrap {
  flex: 1; position: relative;
}
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--muted2); pointer-events: none;
  display: flex; align-items: center;
}
#searchInput {
  width: 100%; padding: 14px 16px 14px 46px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border-bright);
  border-radius: 100px;
  font-family: 'Outfit', sans-serif; font-size: .95rem;
  color: var(--text); outline: none;
  transition: border-color .25s, background .25s, box-shadow .25s;
}
#searchInput::placeholder { color: var(--muted2); }
#searchInput:focus {
  border-color: rgba(232,201,106,0.5);
  background: rgba(232,201,106,0.05);
  box-shadow: 0 0 0 4px rgba(232,201,106,0.08);
}

#filterBtn {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 20px; border-radius: 100px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border-bright);
  color: var(--text); font-family: 'Outfit', sans-serif;
  font-size: .85rem; font-weight: 500; cursor: pointer;
  transition: all .2s; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
#filterBtn:hover, #filterBtn.active {
  border-color: rgba(232,201,106,0.4);
  background: rgba(232,201,106,0.08); color: var(--gold);
}
#filterBtn svg { transition: transform .25s; }
#filterBtn.open svg { transform: rotate(180deg); }

/* ══════════════════════════════════════
   FILTER PANEL
══════════════════════════════════════ */
#filterPanel {
  position: relative; z-index: 2;
  max-width: 660px; margin: 10px auto 0;
  background: rgba(11,14,26,0.95);
  border: 1px solid var(--border-bright);
  border-radius: var(--r-lg); padding: 1.25rem;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  display: none;
  animation: panelIn .2s ease both;
}
#filterPanel.open { display: block; }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.filter-label {
  font-size: .65rem; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted2); margin-bottom: .75rem;
}
.filter-chips {
  display: flex; flex-wrap: wrap; gap: .45rem;
}
.filter-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: .78rem; font-weight: 500; cursor: pointer;
  transition: all .18s; -webkit-tap-highlight-color: transparent;
}
.filter-chip:hover { border-color: var(--border-bright); color: var(--text); }
.filter-chip.active {
  background: rgba(232,201,106,0.12);
  border-color: rgba(232,201,106,0.4); color: var(--gold);
}
.chip-icon { font-size: .9rem; }
.filter-clear {
  margin-top: .85rem; padding-top: .85rem;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end;
}
.filter-clear button {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: .75rem; font-family: 'Outfit', sans-serif;
  transition: color .18s; -webkit-tap-highlight-color: transparent;
}
.filter-clear button:hover { color: var(--text); }

/* ══════════════════════════════════════
   STATS BAR
══════════════════════════════════════ */
.stats-bar {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 3rem auto 0; padding: 0 2rem;
  display: flex; align-items: center; gap: 1rem;
}
.stats-count {
  font-size: .8rem; color: var(--muted);
}
.stats-count strong { color: var(--gold); }
.stats-sort {
  margin-left: auto; display: flex; gap: .4rem;
}
.sort-btn {
  padding: 5px 12px; border-radius: 100px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  font-family: 'Outfit', sans-serif; font-size: .72rem;
  font-weight: 500; color: var(--muted);
  transition: all .18s; -webkit-tap-highlight-color: transparent;
}
.sort-btn.active {
  background: rgba(232,201,106,0.1); border-color: rgba(232,201,106,0.3);
  color: var(--gold);
}

/* ══════════════════════════════════════
   FILES GRID
══════════════════════════════════════ */
#filesGrid {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 1.5rem auto 4rem; padding: 0 2rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 1rem;
}

.file-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 1.35rem 1.25rem;
  cursor: pointer; text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: .75rem;
  transition: transform .25s cubic-bezier(.22,.68,0,1.3),
              border-color .25s, box-shadow .25s, background .25s;
  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  animation: cardIn .4s ease both;
  contain: layout style;
}
.file-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--card-accent, transparent) 0%, transparent 60%);
  opacity: 0; transition: opacity .3s;
}
.file-card:hover {
  transform: translateY(-4px);
  border-color: var(--card-accent, var(--border-bright));
  box-shadow: 0 16px 48px rgba(0,0,0,0.4);
}
.file-card:hover::before { opacity: 0.06; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem;
}
.file-type-badge {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
}
.file-type-badge svg {
  width: 20px; height: 20px;
  stroke: var(--muted); flex-shrink: 0;
}
.cat-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 100px;
  font-size: .65rem; font-weight: 600; letter-spacing: .5px;
  white-space: nowrap;
}

.file-name {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700; line-height: 1.35;
  color: var(--text); word-break: break-word;
}

.card-meta {
  display: flex; align-items: center; gap: .65rem;
  font-size: .7rem; color: var(--muted2);
}
.meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted2); flex-shrink: 0; }

.card-actions {
  display: flex; gap: .5rem;
  margin-top: auto; padding-top: .65rem;
  border-top: 1px solid var(--border);
  opacity: 0; transition: opacity .2s;
}
.file-card:hover .card-actions { opacity: 1; }
.card-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 100px;
  font-size: .72rem; font-weight: 600;
  cursor: pointer; transition: all .18s;
  text-decoration: none; border: none;
  font-family: 'Outfit', sans-serif;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.card-btn-open {
  background: rgba(110,174,255,0.1);
  border: 1px solid rgba(110,174,255,0.25);
  color: var(--blue);
}
.card-btn-open:hover { background: rgba(110,174,255,0.2); }
.card-btn-dl {
  background: rgba(232,201,106,0.1);
  border: 1px solid rgba(232,201,106,0.25);
  color: var(--gold);
}
.card-btn-dl:hover { background: rgba(232,201,106,0.2); }

/* ══════════════════════════════════════
   STATES
══════════════════════════════════════ */
.state-loading {
  grid-column: 1/-1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 5rem 2rem; gap: 1rem;
  color: var(--muted);
}
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid rgba(232,201,106,0.15);
  border-top-color: var(--gold);
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.state-empty {
  grid-column: 1/-1; text-align: center;
  padding: 5rem 2rem;
}
.empty-icon { margin-bottom: 1rem; opacity: .4; display: flex; justify-content: center; }
.empty-icon svg { stroke: var(--muted); }
.empty-text { color: var(--muted); font-size: .9rem; }

/* ══════════════════════════════════════
   AUTH MODAL
══════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.modal-overlay.show {
  opacity: 1; pointer-events: all;
}

.auth-modal {
  width: 100%; max-width: 400px;
  background: rgba(11,14,26,0.98);
  border: 1px solid var(--border-bright);
  border-radius: 28px; overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.7);
  transform: scale(.92) translateY(16px);
  transition: transform .3s cubic-bezier(.22,.68,0,1.3);
  position: relative;
}
.modal-overlay.show .auth-modal {
  transform: scale(1) translateY(0);
}
.modal-glow {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold) 30%, #fff 50%, var(--gold) 70%, transparent);
}

.modal-header {
  padding: 2rem 2rem 0;
  display: flex; align-items: flex-start; justify-content: space-between;
}
.modal-brand {
  display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem;
}
.modal-brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--gold), #c8a040);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 900; color: #06080f;
}
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; font-weight: 700; letter-spacing: -.3px;
}
.modal-close {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 1.2rem; padding: 4px 8px;
  transition: color .18s; line-height: 1; margin-top: -2px;
  -webkit-tap-highlight-color: transparent;
}
.modal-close:hover { color: var(--text); }

.modal-tabs {
  display: flex; margin: 0 2rem 1.5rem;
  background: rgba(255,255,255,0.04);
  border-radius: 12px; padding: 4px;
}
.m-tab {
  flex: 1; padding: 9px;
  background: none; border: none; cursor: pointer;
  font-family: 'Outfit', sans-serif; font-size: .82rem; font-weight: 600;
  color: var(--muted); border-radius: 9px;
  transition: all .22s; -webkit-tap-highlight-color: transparent;
}
.m-tab.active {
  background: rgba(232,201,106,0.12);
  color: var(--gold); box-shadow: 0 2px 12px rgba(232,201,106,0.15);
}

.modal-form {
  padding: 0 2rem 2rem;
  display: none; flex-direction: column; gap: .85rem;
}
.modal-form.active { display: flex; animation: fadeUp .2s ease both; }

.form-group { display: flex; flex-direction: column; gap: .45rem; }
.form-label {
  font-size: .67rem; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted2);
}
.form-input {
  padding: 12px 15px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; outline: none;
  font-family: 'Outfit', sans-serif; font-size: .9rem;
  color: var(--text); transition: all .2s;
}
.form-input::placeholder { color: var(--muted2); }
.form-input:focus {
  border-color: rgba(232,201,106,0.5);
  background: rgba(232,201,106,0.04);
  box-shadow: 0 0 0 3px rgba(232,201,106,0.08);
}

.form-msg {
  font-size: .78rem; min-height: 16px; letter-spacing: .2px;
}

.form-submit {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, rgba(232,201,106,0.25), rgba(200,160,64,0.18));
  border: 1px solid rgba(232,201,106,0.4);
  border-radius: 12px; cursor: pointer;
  font-family: 'Outfit', sans-serif; font-size: .9rem; font-weight: 700;
  color: var(--gold); letter-spacing: .4px;
  transition: all .2s; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 6px 24px rgba(232,201,106,0.1);
}
.form-submit:hover {
  background: linear-gradient(135deg, rgba(232,201,106,0.35), rgba(200,160,64,0.26));
  box-shadow: 0 8px 32px rgba(232,201,106,0.2);
}
.form-submit:active { transform: scale(.98); }

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(11,14,26,0.96); border: 1px solid var(--border-bright);
  border-radius: 100px; padding: 10px 20px;
  font-size: .82rem; font-weight: 500; color: var(--text);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: opacity .3s; white-space: nowrap;
  backdrop-filter: blur(12px);
}
#toast.show { opacity: 1; }

/* ══════════════════════════════════════
   FILE VIEWER
══════════════════════════════════════ */
#fileViewer {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
#fileViewer.show { opacity: 1; pointer-events: all; }

.fv-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px;
  background: rgba(6,8,15,0.8);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.fv-name {
  flex: 1; font-size: .88rem; font-weight: 600;
  color: var(--text); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.fv-meta { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.fv-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 9px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted); cursor: pointer;
  transition: all .18s; flex-shrink: 0;
  text-decoration: none; font-size: .85rem;
}
.fv-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }
.fv-btn.gold { background: rgba(232,201,106,0.1); border-color: rgba(232,201,106,0.3); color: var(--gold); }
.fv-btn.gold:hover { background: rgba(232,201,106,0.2); }

.fv-body {
  flex: 1; display: flex; align-items: center;
  justify-content: center; overflow: hidden; position: relative;
}

/* Изображения */
.fv-img-wrap {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; cursor: zoom-in;
}
.fv-img-wrap.zoomed { cursor: zoom-out; overflow: auto; align-items: flex-start; justify-content: flex-start; }
.fv-img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  transition: transform .3s cubic-bezier(.22,.68,0,1.3);
  user-select: none; -webkit-user-select: none;
  pointer-events: none;
}
.fv-img-wrap.zoomed .fv-img {
  max-width: none; max-height: none;
  transform: scale(2);
  transform-origin: top left;
  pointer-events: all;
}

/* PDF / iframe */
.fv-iframe {
  width: 100%; height: 100%;
  border: none; background: #fff;
}

/* Неподдерживаемый файл */
.fv-unsupported {
  text-align: center; padding: 3rem 2rem;
}
.fv-unsupported-ico { font-size: 4rem; margin-bottom: 1rem; display: block; opacity: .5; }
.fv-unsupported-text { color: var(--muted); font-size: .9rem; line-height: 1.7; }

/* Загрузка */
.fv-loading {
  display: flex; flex-direction: column;
  align-items: center; gap: 1rem; color: var(--muted);
}
.fv-spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid rgba(232,201,106,0.15);
  border-top-color: var(--gold);
  animation: spin .9s linear infinite;
}

/* ══════════════════════════════════════
   RESPONSIVE

<script src="https://ferniex-id.vercel.app/sdk/fernieid-sdk.js"></script>
<script>
FernieID.init('fid_48919a000140bf6b7e7767281ffc31329647d6a5c133fe8f');
console.log('скрипт загружен');
document.addEventListener('click', e => console.log('клик на:', e.target.className, e.target.tagName));
// Авто-определяем API URL:
// - на Vercel фронт и бэк на одном домене → ''
// - если открываешь index.html напрямую из файла → нужен явный адрес сервера
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? `http://${location.hostname}:3000`
  : '';  // на продакшне (Vercel) — тот же домен
const EXT_GROUPS = {
  doc:  ['pdf','doc','docx','odt','rtf','txt','md'],
  sheet:['xls','xlsx','ods','csv'],
  slide:['ppt','pptx','odp','key'],
  zip:  ['zip','rar','7z','tar','gz'],
  img:  ['jpg','jpeg','png','gif','webp','svg','bmp'],
  video:['mp4','avi','mov','mkv','wmv','webm'],
  audio:['mp3','wav','ogg','flac','m4a'],
  code: ['js','ts','html','css','py','java','cpp','c','json','xml'],
};
const EXT_SVG = {
  doc:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
  sheet:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>`,
  slide:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
  zip:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><line x1="9" y1="15" x2="15" y2="15"/></svg>`,
  img:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  video:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`,
  audio:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`,
  file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
};
function extGroup(ext) {
  const e = ext?.toLowerCase() || '';
  for (const [group, exts] of Object.entries(EXT_GROUPS)) {
    if (exts.includes(e)) return group;
  }
  return 'file';
}
function extIcon(ext) { return EXT_SVG[extGroup(ext)]; }
function fmtSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' КБ';
  return (bytes/1024/1024).toFixed(1) + ' МБ';
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
}
function nameWithoutExt(name) {
  return name.replace(/\.[^/.]+$/, '');
}

// ══ STATE ══
let allFiles = [], categories = [], activeFilters = new Set(['all']);
let sortMode = 'name', currentUser = null;
let searchQ = '';

// ══ INIT ══
(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem('fernieid_user'));
    if (saved) {
      const r = await fetch(`${API}/api/auth/fernie-check`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: saved.userId, username: saved.username })
      });
      const d = await r.json();
      if (d.success) setUser({ ...saved, isAdmin: d.isAdmin });
      else localStorage.removeItem('fernieid_user');
    }
  } catch {}
  await Promise.all([loadCategories(), loadFiles()]);
})();
async function loadCategories() {
  try {
    const res = await fetch(`${API}/api/categories`);
    const data = await res.json();
    categories = data.categories || [];
    renderFilterChips();
  } catch (e) { console.warn('categories error', e); }
}

async function loadFiles() {
  try {
    const res = await fetch(`${API}/api/files`);
    const data = await res.json();
    allFiles = data.files || [];
    renderGrid();
  } catch (e) {
    document.getElementById('filesGrid').innerHTML = `
      <div class="state-empty">
        <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <div class="empty-text">Не удалось загрузить файлы</div>
      </div>`;
  }
}

function renderFilterChips() {
  const chips = document.getElementById('filterChips');
  const allChip = chips.querySelector('[data-cat="all"]');
  chips.innerHTML = '';
  chips.appendChild(allChip);
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip';
    btn.dataset.cat = cat.slug;
    btn.style.setProperty('--chip-c', cat.color);
    btn.innerHTML = `<span class="chip-icon">${cat.icon}</span> ${cat.label} <span style="opacity:.5;font-size:.65rem">${cat.count}</span>`;
    btn.onclick = () => toggleCat(cat.slug, btn);
    chips.appendChild(btn);
  });
}

function toggleCat(slug, el) {
  if (slug === 'all') {
    activeFilters.clear(); activeFilters.add('all');
  } else {
    activeFilters.delete('all');
    if (activeFilters.has(slug)) activeFilters.delete(slug);
    else activeFilters.add(slug);
    if (!activeFilters.size) activeFilters.add('all');
  }
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', activeFilters.has(c.dataset.cat));
  });
  renderGrid();
}

function clearFilters() {
  activeFilters.clear(); activeFilters.add('all');
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === 'all');
  });
  renderGrid();
}

function toggleFilter() {
  const panel = document.getElementById('filterPanel');
  const btn = document.getElementById('filterBtn');
  const open = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase().trim();
  renderGrid();
});

function setSort(mode, el) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function getFiltered() {
  let files = allFiles.filter(f => {
    const matchCat = activeFilters.has('all') || activeFilters.has(f.category);
    const matchQ = !searchQ || nameWithoutExt(f.name).toLowerCase().includes(searchQ)
                || f.categoryLabel.toLowerCase().includes(searchQ);
    return matchCat && matchQ;
  });
  if (sortMode === 'name') files.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  else if (sortMode === 'cat') files.sort((a, b) => a.categoryLabel.localeCompare(b.categoryLabel, 'ru'));
  else if (sortMode === 'date') files.sort((a, b) => new Date(b.modified) - new Date(a.modified));
  return files;
}

async function downloadFile(url, name) {
  try {
    showToast('⏳ Скачиваем...');
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('✅ Скачано!');
  } catch (e) {
    // Фолбэк — просто открываем в новой вкладке
    window.open(url, '_blank');
  }
}

function makeCard(f, i)
{
  const div = document.createElement('div');
  div.className = 'file-card';
  const viewable = ['pdf','jpg','jpeg','png','gif','webp','bmp','svg','mp4','webm','mp3','wav','ogg','m4a'];
  const canPreview = viewable.includes(f.ext?.toLowerCase());
  const isMobile = window.innerWidth <= 640;
  div.style.cssText = `--card-accent:${f.categoryColor};${isMobile ? '' : `animation-delay:${Math.min(i * 0.04, 0.4)}s`}`;
  div.innerHTML = `
    <div class="card-top">
      <div class="file-type-badge">${extIcon(f.ext)}</div>
      <span class="cat-badge"
        style="background:${f.categoryColor}18;border:1px solid ${f.categoryColor}38;color:${f.categoryColor}">
        ${f.categoryIcon} ${f.categoryLabel}
      </span>
    </div>
    <div class="file-name">${nameWithoutExt(f.name)}</div>
    <div class="card-meta">
      <span>${f.ext?.toUpperCase() || 'FILE'}</span>
      <div class="meta-dot"></div>
      <span>${fmtSize(f.size)}</span>
      <div class="meta-dot"></div>
      <span>${fmtDate(f.modified)}</span>
    </div>
    <div class="card-actions">
      ${canPreview ? `<button class="card-btn card-btn-open">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Открыть
        </button>` : ''}
      <button class="card-btn card-btn-dl">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Скачать
      </button>
    </div>`;

  if (canPreview) {
    div.querySelector('.card-btn-open').addEventListener('click', (e) => {
      e.stopPropagation();
      openViewer(f);
    });
  }
  div.querySelector('.card-btn-dl').addEventListener('click', (e) => {
    e.stopPropagation();
    downloadFile(f.url, f.name);
  });
  return div;
}

let _renderTimer = null;
function renderGrid() {
  if (_renderTimer) cancelAnimationFrame(_renderTimer);
  _renderTimer = requestAnimationFrame(() => {
    const grid = document.getElementById('filesGrid');
    const files = getFiltered();
    const total = allFiles.length;
    document.getElementById('statsCount').innerHTML =
      `Показано <strong>${files.length}</strong> из ${total} материалов`;

    if (!files.length) {
      grid.innerHTML = `
        <div class="state-empty">
          <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
          <div class="empty-text">Ничего не найдено.<br>Попробуй другой запрос или сброс фильтров.</div>
        </div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    files.forEach((f, i) => frag.appendChild(makeCard(f, i)));
    grid.innerHTML = '';
    grid.appendChild(frag);
  });
}

// ══ AUTH ══
function openAuthModal() { document.getElementById('authModal').classList.add('show'); }
function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); }
document.getElementById('authModal').addEventListener('click', e => {
  if (e.target === document.getElementById('authModal')) closeAuthModal();
});

function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabReg').classList.toggle('active', !isLogin);
  document.getElementById('formLogin').classList.toggle('active', isLogin);
  document.getElementById('formReg').classList.toggle('active', !isLogin);
  document.getElementById('modalTitle').textContent = isLogin ? 'Войти в аккаунт' : 'Создать аккаунт';
  document.getElementById('loginMsg').textContent = '';
  document.getElementById('regMsg').textContent = '';
}

document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('regPass2').addEventListener('keydown', e => {
  if (e.key === 'Enter') doRegister();
});

async function doLogin() {
  closeAuthModal();
  if (typeof FernieID === 'undefined') {
    showToast('❌ FernieID SDK не загружен');
    return;
  }
  const data = await FernieID.login();
  if (!data || !data.success) return;
  const r = await fetch(`${API}/api/auth/fernie-check`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId: data.userId, username: data.username })
  });
  const check = await r.json();
  if (check.success) {
    const user = { ...data, isAdmin: check.isAdmin };
    localStorage.setItem('fernieid_user', JSON.stringify(user));
    setUser(user);
    showToast('✅ Добро пожаловать, ' + data.username + '!');
  }
}

async function doRegister() { await doLogin(); }

function setUser(user) {
  currentUser = user;
  document.getElementById('loginBtn').style.display = 'none';
  const chip = document.getElementById('userChip');
  chip.style.display = 'flex';
  document.getElementById('userAv').textContent = (user.username||'?')[0].toUpperCase();
  document.getElementById('userName').textContent = user.username;
  const roleEl = document.getElementById('userRole');
  roleEl.textContent = user.isAdmin ? 'Администратор' : 'Пользователь';
  roleEl.className = 'user-role role-' + (user.isAdmin ? 'admin' : 'user');
  document.getElementById('logoutBtn').style.display = 'inline-block';
  const adminBtn = document.getElementById('adminBtn');
  if (adminBtn) adminBtn.style.display = user.isAdmin ? 'flex' : 'none';
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('fernieid_user');
  document.getElementById('loginBtn').style.display = '';
  document.getElementById('userChip').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  const adminBtn = document.getElementById('adminBtn');
  if (adminBtn) adminBtn.style.display = 'none';
  showToast('👋 Вы вышли из аккаунта');
}

// ══ FILE VIEWER ══
function openViewer(f) {
  const viewer = document.getElementById('fileViewer');
  const body   = document.getElementById('fvBody');
  const ext    = f.ext?.toLowerCase() || '';

  document.getElementById('fvName').textContent = f.name;
  document.getElementById('fvMeta').textContent = [f.ext?.toUpperCase(), fmtSize(f.size)].filter(Boolean).join(' · ');
  document.getElementById('fvDownload').href = f.url;

  // Рендер содержимого
  if (['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext)) {
    body.innerHTML = `<div class="fv-img-wrap" id="fvImgWrap">
      <img class="fv-img" id="fvImg" src="${f.url}" alt="${f.name}">
    </div>`;
    const wrap = document.getElementById('fvImgWrap');
    const img  = document.getElementById('fvImg');
    // Зум по клику
    wrap.addEventListener('click', () => wrap.classList.toggle('zoomed'));
    // Перетаскивание при зуме
    let dragging=false, sx=0, sy=0, sl=0, st=0;
    wrap.addEventListener('mousedown', e => {
      if(!wrap.classList.contains('zoomed')) return;
      dragging=true; sx=e.clientX; sy=e.clientY;
      sl=wrap.scrollLeft; st=wrap.scrollTop;
    });
    window.addEventListener('mousemove', e => {
      if(!dragging) return;
      wrap.scrollLeft = sl-(e.clientX-sx);
      wrap.scrollTop  = st-(e.clientY-sy);
    });
    window.addEventListener('mouseup', () => dragging=false);
  } else if (ext === 'pdf') {
    body.innerHTML = `<iframe class="fv-iframe" src="${f.url}#toolbar=1&navpanes=0" title="${f.name}"></iframe>`;
  } else if (['mp4','webm'].includes(ext)) {
    body.innerHTML = `<video controls autoplay style="max-width:100%;max-height:100%;border-radius:8px;outline:none" src="${f.url}"></video>`;
  } else if (['mp3','wav','ogg','m4a'].includes(ext)) {
    body.innerHTML = `<div style="text-align:center;padding:3rem 2rem">
      <div style="margin-bottom:1.5rem;opacity:.6"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div style="font-size:1rem;font-weight:600;color:var(--text);margin-bottom:1.5rem">${f.name}</div>
      <audio controls autoplay style="width:100%;max-width:420px;outline:none">
        <source src="${f.url}">
      </audio>
    </div>`;
  } else {
    body.innerHTML = `<div class="fv-unsupported">
      <span class="fv-unsupported-ico">${extIcon(ext)}</span>
      <div class="fv-unsupported-text">Предпросмотр недоступен для .${ext}<br>Нажми кнопку скачать для открытия файла</div>
    </div>`;
  }

  viewer.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  const viewer = document.getElementById('fileViewer');
  viewer.classList.remove('show');
  document.body.style.overflow = '';
  // Останавливаем медиа
  viewer.querySelectorAll('video,audio').forEach(m => m.pause());
  setTimeout(() => { document.getElementById('fvBody').innerHTML = '<div class="fv-loading"><div class="fv-spinner"></div><span>Загружаем...</span></div>'; }, 250);
}

document.getElementById('fvClose').addEventListener('click', closeViewer);
document.getElementById('fileViewer').addEventListener('click', e => {
  if(e.target === document.getElementById('fileViewer') || e.target === document.getElementById('fvBody')) closeViewer();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeViewer();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
